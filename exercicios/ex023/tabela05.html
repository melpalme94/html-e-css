<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">Exercicio De Tabela</title>
        <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th,
        td {
            border: 1px solid gray;
            padding: 8px;
        }
    </style>
</head>

<body>
  <h1>Exercicio de Tabela</h1>
  <table>
    <caption>Cadastro</caption>
    <tr>
        <th scope="col">Nome</th>
        <th>Sexo</th>
        <th>Idade</th>
        <th>Profissão</th>
    </tr>

    <tr>
        <th scope="col">Ana Maria</th>
        <th>F</th>
        <th>25</th>
        <th>Jornalista</th>
    </tr>
    
  </table>

</body>

</html>
